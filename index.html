<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: Haushaltsbuch-App — feste Kopfzeile mit Jahreswahl, Inhalt in Karten, untere Tab-Leiste. Farbton "Schiefer-Petrol" wie ein Hausdach. */
:root{
  --bg:#f2f4f4; --surface:#ffffff; --surface2:#e7ecec; --fg:#17201f; --muted:#5b6968; --line:#d6dfde;
  --accent:#1d5c63; --accent-fg:#ffffff; --accent-soft:#dcecec;
  --ok:#2e7a4d; --ok-soft:#e1f1e7; --warn:#97600c; --warn-soft:#f7ebd4; --bad:#b1261e; --bad-soft:#f8e1df;
  --f-display:"Bitter", Georgia, "Times New Roman", serif;
  --f-body:"Figtree", -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:12px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101615; --surface:#18201f; --surface2:#222c2b; --fg:#e8efee; --muted:#9fb0ae; --line:#2f3b3a;
  --accent:#6cc0c4; --accent-fg:#0b1a1b; --accent-soft:#1d3436;
  --ok:#6cc18c; --ok-soft:#1c3226; --warn:#e2a74c; --warn-soft:#382b16; --bad:#f08a82; --bad-soft:#3c1f1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101615; --surface:#18201f; --surface2:#222c2b; --fg:#e8efee; --muted:#9fb0ae; --line:#2f3b3a;
  --accent:#6cc0c4; --accent-fg:#0b1a1b; --accent-soft:#1d3436;
  --ok:#6cc18c; --ok-soft:#1c3226; --warn:#e2a74c; --warn-soft:#382b16; --bad:#f08a82; --bad-soft:#3c1f1d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.3rem} h3{font-size:1.06rem}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.86rem}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}

main{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:16px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom,0px))}

td.bg input{text-align:left;min-width:180px}

nav.tabs button[aria-current="page"]{color:var(--accent)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}

.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.empty{padding:26px 12px;text-align:center;color:var(--muted)}

.notice.info{background:var(--accent-soft)}
.month-h{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:14px 4px 4px}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:.85rem;font-weight:600;color:var(--muted)}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--accent)}
textarea{min-height:70px;resize:vertical}
.big-in{font-size:1.5rem!important;font-weight:700;font-variant-numeric:tabular-nums}
.check{display:flex;gap:10px;align-items:center;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:8px 14px;cursor:pointer;font-weight:500;min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.gtiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.gtile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0}
.gtile.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.gt-main{background:none;border:0;text-align:left;padding:12px 12px 6px;display:flex;flex-direction:column;gap:2px;cursor:pointer;border-radius:var(--r) var(--r) 0 0}
.gt-main b{font-size:1.15rem}
.gt-act{display:flex;gap:6px;padding:0 10px 10px}
.gt-act .btn{flex:1;padding:6px 8px}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td input{min-height:38px;padding:6px 8px;text-align:right;min-width:90px}
tfoot td{font-weight:700;border-bottom:0}
.plus{color:var(--ok)} .minus{color:var(--bad)}
.bar{height:10px;border-radius:6px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.kbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.kbar .bar{grid-column:1/-1}

/* Abrechnung als Schriftstück */
.paper{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:24px 22px;max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.paper .addr{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));font-size:.92rem}
.paper h2{font-size:1.25rem}
.result{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-top:2px solid var(--fg);padding-top:12px}
.result b{font-size:1.6rem;font-variant-numeric:tabular-nums}
.thumb{width:84px;height:84px;border-radius:10px;object-fit:cover;border:1px solid var(--line);background:var(--surface2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;font-weight:600;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head><body>
<div id="update-bar" class="notice info" hidden style="position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:40;display:flex;gap:10px;align-items:center">Neue Version verfügbar <button class="btn sm" onclick="location.reload()">Neu laden</button></div>
<header class="topbar"><div class="topbar-in">
  <div class="brand">Nebenkosten<small id="objname">Hüttenheim</small></div>
  <div class="yearsel" aria-label="Abrechnungsjahr">
    <button class="icon-btn" id="y-prev" aria-label="Vorjahr">‹</button><b id="y-val">2026</b><button class="icon-btn" id="y-next" aria-label="Folgejahr">›</button>
  </div>
  <span class="status-dot" id="conn"><i></i><span>Verbinde …</span></span>
</div></header>
<main><div id="view"></div></main>
<nav class="tabs" aria-label="Bereiche"><div class="in" id="nav"></div></nav>
<input type="file" id="beleg-file" accept="image/*,application/pdf" hidden>
<input type="file" id="scan-file" accept="image/*" capture="environment" hidden>
<input type="file" id="import-file" accept="application/json,.json" hidden>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- Helfer ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fmtDate=s=>{if(!s)return'';const[y,m,d]=s.split('-');return d+'.'+m+'.'+y};
const eur=n=>(Number(n)||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const nf=(n,d=2)=>(Number(n)||0).toLocaleString('de-DE',{minimumFractionDigits:0,maximumFractionDigits:d});
const num=v=>{if(v==null||v==='')return 0;if(typeof v==='number')return v;let s=String(v).trim().replace(/\s|€/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isFinite(n)?n:0};
const r2=n=>Math.round(n*100)/100;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o||{}));
const MONATE=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function toast(t,ms=2600){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,ms)}
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

const SCHLUESSEL={
  flaeche:'Wohn-/Nutzfläche (m²)',
  personen:'Personenzahl',
  einheiten:'Je Einheit gleich',
  verbrauch:'Verbrauch (Zähler)',
  mix:'Verbrauch + Fläche (z. B. 70/30)',
  mixpers:'Personen + Fläche (z. B. 60/40)',
  direkt:'Nur direkt zugeordnet'
};
const TYP={vermietet:'Vermietet',gewerbe:'Gewerbe vermietet',eigen:'Eigennutzung',betrieb:'Eigener Betrieb'};
const ohneMieter=e=>e.typ==='eigen'||e.typ==='betrieb';
const ART35={dienst:'Haushaltsnahe Dienstleistung',handwerker:'Handwerkerleistung'};

/* ---------- Zustand ---------- */
const S={settings:{},einheiten:[],kostenarten:[],belege:[],jahre:{},ready:false,loaded:new Set(),
  tab:'start',year:Number(ls.get('nk-year'))||new Date().getFullYear(),edit:null,filterK:'',abrE:'',canWrite:true};
const COLS=['einheiten','kostenarten','belege','jahre'];
let db=null,assets=null,downloads=null;

/* ---------- Speicher ---------- */
const queues={};
function mutate(path,fn){
  const p=(queues[path]||Promise.resolve()).then(async()=>{
    const ref=db.doc(path);const snap=await ref.get();
    const next=fn(snap.exists?clone(snap.data()):{});
    await ref.set(next);return next;});
  queues[path]=p.catch(()=>{});return p;
}
function dbFail(e){console.error(e);const c=e&&e.code;
  if(c==='quota_exceeded')toast('Speicher voll – bitte unter Einstellungen eine Sicherung exportieren.',6000);
  else if(c==='invalid_argument'||c==='permission_denied')toast('Keine Schreibrechte in dieser Ansicht.',5000);
  else toast('Speichern fehlgeschlagen – bitte erneut versuchen.',4000);}
async function save(path,data){if(!db){toast('Speicher nicht verbunden.');return false}try{await db.doc(path).set(data);return true}catch(e){dbFail(e);return false}}
async function del(path){try{await db.doc(path).delete();return true}catch(e){dbFail(e);return false}}

let rq=false;
function scheduleRender(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;safeRender()})}
function safeRender(){try{render()}catch(err){console.error(err);const v=$('#view');if(v)v.innerHTML='<div class="card"><h3>Anzeigefehler</h3><p class="small">Bitte Screenshot an Claude schicken:</p><pre class="small" style="white-space:pre-wrap">'+esc(err&&err.stack||err)+'</pre></div>'}}
window.addEventListener('error',ev=>{const v=$('#view');if(v&&!v.innerHTML.includes('Anzeigefehler'))v.insertAdjacentHTML('afterbegin','<div class="notice">Fehler: '+esc(ev.message)+'</div>')});

/* ================= Speicher: alles im Gerät (IndexedDB) + Abgleich mit dem eigenen Server ================= */
const IDB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('nebenkosten',1);
    r.onupgradeneeded=()=>{const d=r.result;['docs','blobs','meta'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n)})};
    r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  req(store,mode,fn){return new Promise((res,rej)=>{let t;try{t=this.db.transaction(store,mode)}catch(e){rej(e);return}
    const rq=fn(t.objectStore(store));let out;if(rq)rq.onsuccess=()=>{out=rq.result};
    t.oncomplete=()=>res(out);t.onerror=t.onabort=()=>{const e=t.error;rej(e&&e.name==='QuotaExceededError'?{code:'quota_exceeded'}:e)}})},
  get(s,k){return this.req(s,'readonly',st=>st.get(k))},
  put(s,k,v){return this.req(s,'readwrite',st=>st.put(v,k))},
  del(s,k){return this.req(s,'readwrite',st=>st.delete(k))},
  keys(s){return this.req(s,'readonly',st=>st.getAllKeys())},
  all(s){return this.req(s,'readonly',st=>st.getAll())}
};
/* Gleiche Schnittstelle wie vorher (doc/collection/onSnapshot), Daten im Gerät */
const LocalDB={cache:new Map(),colL:new Map(),docL:new Map(),
  async load(){const ks=await IDB.keys('docs'),vs=await IDB.all('docs');ks.forEach((k,i)=>this.cache.set(k,vs[i]))},
  colOf:p=>p.split('/')[0],
  snapDoc(p){const d=this.cache.get(p);return{id:p.split('/')[1],exists:d!==undefined,data:()=>d===undefined?undefined:clone(d)}},
  snapCol(c){return{docs:[...this.cache.keys()].filter(k=>this.colOf(k)===c).map(k=>this.snapDoc(k))}},
  notify(p){const c=this.colOf(p);(this.docL.get(p)||[]).forEach(f=>f(this.snapDoc(p)));(this.colL.get(c)||[]).forEach(f=>f(this.snapCol(c)))},
  async write(p,data){if(data===undefined){this.cache.delete(p);await IDB.del('docs',p)}else{this.cache.set(p,clone(data));await IDB.put('docs',p,clone(data))}this.notify(p)},
  async applyRemote(p,data){await this.write(p,data)}
};
const localDb={
  doc(p){return{
    get:async()=>LocalDB.snapDoc(p),
    set:async d=>{await LocalDB.write(p,d);syncMark(p)},
    delete:async()=>{await LocalDB.write(p,undefined);syncMark(p)},
    onSnapshot(f){const a=LocalDB.docL.get(p)||[];a.push(f);LocalDB.docL.set(p,a);setTimeout(()=>f(LocalDB.snapDoc(p)),0);return()=>{}}}},
  collection(c){return{onSnapshot(f){const a=LocalDB.colL.get(c)||[];a.push(f);LocalDB.colL.set(c,a);setTimeout(()=>f(LocalDB.snapCol(c)),0);return()=>{}}}}
};
/* Belegfotos/PDFs im Gerät */
const blobUrls=new Map();
const localAssets={async upload(blob){const id=uid()+uid();await IDB.put('blobs',id,{blob,type:blob.type,ts:Date.now(),size:blob.size});syncMarkBlob(id,'put');return{id,contentType:blob.type||'application/octet-stream'}}};
async function blobUrl(id){if(blobUrls.has(id))return blobUrls.get(id);let r=await IDB.get('blobs',id).catch(()=>null);
  if(!r&&SRV.cfg){const b=await srvBlobGet(id).catch(()=>null);if(b){r={blob:b,type:b.type};await IDB.put('blobs',id,{blob:b,type:b.type,ts:Date.now(),size:b.size}).catch(()=>{})}}
  if(!r)return null;const u=URL.createObjectURL(r.blob);blobUrls.set(id,u);return u}
async function hydrateBlobs(root){for(const el of $$('[data-blob]',root)){const u=await blobUrl(el.dataset.blob);
  if(!u){el.replaceWith(Object.assign(document.createElement('span'),{className:'small muted',textContent:'Datei nicht auf diesem Gerät'}));continue}
  if(el.tagName==='IMG')el.src=u;else{el.onclick=()=>window.open(u,'_blank')}}}
/* Datei an den Nutzer geben (Download im Browser) */
const localDownloads={async save({filename,data}){const blob=data instanceof Blob?data:new Blob([data],{type:'text/plain;charset=utf-8'});
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);return{status:'saved'}}};

/* ---------- Server: CouchDB auf dem M920q (Add-on „SEEN Datenbank“), Datenbank „nebenkosten“, über Tailscale ---------- */
const DBNAME='nebenkosten';
const SRV={cfg:null,seq:'0',revs:{},dirty:{},bdirty:{},status:'',running:false,pushT:null};
function srvCfgLesen(){try{const c=JSON.parse(ls.get('nk-server')||'null');return c&&c.url?c:null}catch(_){return null}}
const encId=id=>encodeURIComponent(id);
function srvRaw(cfg,path,opt={}){const h={Authorization:'Basic '+btoa(unescape(encodeURIComponent(cfg.user+':'+cfg.pass))),...(opt.headers||{})};let body=opt.body;
  if(opt.json!==undefined){h['Content-Type']='application/json';body=JSON.stringify(opt.json)}
  return fetch(cfg.url.replace(/\/+$/,'')+'/'+DBNAME+path,{method:opt.method||'GET',headers:h,body,cache:'no-store',signal:opt.signal})}
const srv=(path,opt)=>srvRaw(SRV.cfg,path,opt);

let pushing=false;
async function syncPush(){if(pushing||!navigator.onLine)return;pushing=true;try{
  for(const p of Object.keys(SRV.dirty)){const mark=SRV.dirty[p];const id='d:'+p;let data=LocalDB.cache.get(p);
    for(let n=0;n<4;n++){let r;

      if(r.ok){const j=await r.json();if(data===undefined)delete SRV.revs[p];else SRV.revs[p]=j.rev;break}
      if(r.status===409||r.status===404){const g=await srv('/'+encId(id));if(g.ok){SRV.revs[p]=(await g.json())._rev}else{delete SRV.revs[p];if(data===undefined)break}continue}
      if(r.status===401)throw new Error('Server: Anmeldung abgelehnt');throw new Error('HTTP '+r.status)}

    if(w.startsWith('put:')){const r=await IDB.get('blobs',id);if(r&&r.blob)await srvBlobPut(id,r.blob,r.type)}

async function syncPull(longpoll){const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),longpoll?40000:30000);

    const j=await r.json();
    for(const ch of j.results){if(!ch.id.startsWith('d:'))continue;const p=ch.id.slice(2);
      if(ch.deleted){delete SRV.revs[p];if(!SRV.dirty[p]&&LocalDB.cache.has(p))await LocalDB.applyRemote(p,undefined);continue}
      const d=ch.doc;if(!d||SRV.revs[p]===d._rev)continue;SRV.revs[p]=d._rev;if(!SRV.dirty[p])await LocalDB.applyRemote(p,d.data)}

  finally{clearTimeout(to)}}
async function syncStart(){if(SRV.running)return;SRV.running=true;
  const m=await IDB.get('meta','sync').catch(()=>null);if(m){SRV.seq=m.seq||'0';SRV.revs=m.revs||{};SRV.dirty=m.dirty||{};SRV.bdirty=m.bdirty||{}}
  syncStatus('Im Gerät gespeichert · Abgleich läuft …',true);syncKick(true);
  let fehler=0;
  while(SRV.cfg){try{if(!navigator.onLine)throw new Error('offline');let r=await syncPull(false);while(r.pending>0)r=await syncPull(false);
      fehler=0;if(!Object.keys(SRV.dirty).length)syncStatus('Im Gerät gespeichert · mit Server abgeglichen ✓',true);
      while(SRV.cfg&&navigator.onLine){await syncPull(true);if(Object.keys(SRV.dirty).length+Object.keys(SRV.bdirty).length)syncKick()}}
    catch(e){if(e&&e.name!=='AbortError'){fehler++;syncFehler(e)}await new Promise(r=>setTimeout(r,Math.min(60000,5000*Math.max(1,fehler))))}}

async function srvVerbinden(cfg){
  const t=await srvRaw(cfg,'',{}).catch(e=>({ok:false,status:0,err:e}));
  if(t.status===401)throw new Error('Benutzer oder Passwort falsch.');
  if(t.status===404){const c=await srvRaw(cfg,'',{method:'PUT'});if(!c.ok&&c.status!==412)throw new Error('Datenbank „nebenkosten“ konnte nicht angelegt werden ('+c.status+').')}
  else if(!t.ok)throw new Error('Server nicht erreichbar. Tailscale eingeschaltet? Adresse richtig?');
  SRV.cfg=cfg;ls.set('nk-server',JSON.stringify(cfg));
  SRV.seq='0';SRV.revs={};SRV.dirty={};SRV.bdirty={};
  [...LocalDB.cache.keys()].forEach(p=>SRV.dirty[p]=1);
  (await IDB.keys('blobs')).forEach(id=>SRV.bdirty[id]='put:0');
  syncPersist();syncStart();
}

const einheiten=()=>[...S.einheiten].filter(e=>!e.archiv).sort((a,b)=>(a.reihenfolge||0)-(b.reihenfolge||0)||String(a.name).localeCompare(b.name));

const monateVon=(y,e)=>{const v=ejahr(y,e).monate;return v===undefined||v===''?12:num(v)};
const personenVon=(y,e)=>{const v=ejahr(y,e).personen;return v===undefined||v===''?num(e.personen):num(v)};
const vzMonat=(y,e)=>{const v=ejahr(y,e).vz;return v===undefined||v===''?num(e.vorauszahlung):num(v)};
const vzSumme=(y,e)=>{const g=ejahr(y,e).gezahlt;if(g!==undefined&&g!=='')return num(g);return r2(vzMonat(y,e)*monateVon(y,e))};
const mieteMonat=e=>num(e.miete);
const mieteSumme=(y,e)=>{const g=ejahr(y,e).mieteGezahlt;if(g!==undefined&&g!=='')return num(g);return r2(mieteMonat(e)*monateVon(y,e))};

function verbrauch(y,kId,eId){const z=((jahr(y).zaehler||{})[kId]||{})[eId];if(!z)return null;
  if(z.verbrauch!==undefined&&z.verbrauch!=='')return num(z.verbrauch);
  if((z.a===undefined||z.a==='')||(z.e===undefined||z.e===''))return null;return Math.max(0,num(z.e)-num(z.a))}

/* ---------- Berechnung ---------- */
function umlAnteil(k){if(k.umlagefaehig===false)return 0;const v=k.anteilUml;return Math.min(100,Math.max(0,v===undefined||v===''?100:num(v)))/100}
function teilnehmer(k){return einheiten().filter(e=>!(k.ausgeschlossen||[]).includes(e.id))}
function gewichte(y,k){
  const tn=teilnehmer(k);const zeit=e=>monateVon(y,e)/12;
  const fl=e=>num(e.flaeche)*zeit(e);
  const mk=(f,txt)=>{const w={};let s=0;tn.forEach(e=>{w[e.id]=Math.max(0,f(e));s+=w[e.id]});return{w,s,txt}};
  let res,hinweis='';
  switch(k.schluessel){
    case 'personen':res=mk(e=>personenVon(y,e)*zeit(e),e=>nf(personenVon(y,e),1)+' Pers.');break;
    case 'einheiten':res=mk(e=>zeit(e),()=>'1 Einheit');break;
    case 'verbrauch':{
      res=mk(e=>verbrauch(y,k.id,e.id)||0,e=>nf(verbrauch(y,k.id,e.id)||0)+' '+(k.einheit||''));
      if(res.s===0){res=mk(fl,e=>nf(num(e.flaeche))+' m²');hinweis='Keine Zählerstände – nach Fläche verteilt'}
      break}
    case 'mix':{
      const p=Math.min(100,Math.max(0,num(k.anteilVerbrauch||70)))/100;
      const v=mk(e=>verbrauch(y,k.id,e.id)||0,null);const f=mk(fl,null);
      if(v.s===0){res=mk(fl,e=>nf(num(e.flaeche))+' m²');hinweis='Keine Zählerstände – nach Fläche verteilt'}
      else{const w={};tn.forEach(e=>{w[e.id]=p*(v.w[e.id]/v.s)+(f.s?(1-p)*(f.w[e.id]/f.s):0)});
        res={w,s:1,txt:e=>nf(verbrauch(y,k.id,e.id)||0)+' '+(k.einheit||'')+' / '+nf(num(e.flaeche))+' m²'}}
      break}
    case 'mixpers':{
      const p=Math.min(100,Math.max(0,num(k.anteilVerbrauch||60)))/100;
      const v=mk(e=>personenVon(y,e)*zeit(e),null);const f=mk(fl,null);
      const w={};tn.forEach(e=>{w[e.id]=(v.s?p*(v.w[e.id]/v.s):0)+(f.s?(1-p)*(f.w[e.id]/f.s):0)});
      res={w,s:Object.values(w).reduce((a,b)=>a+b,0),txt:e=>nf(personenVon(y,e),1)+' von '+nf(v.s?tn.reduce((s,x)=>s+personenVon(y,x),0):0,1)+' Pers. / '+nf(num(e.flaeche))+' von '+nf(tn.reduce((s,x)=>s+num(x.flaeche),0))+' m²'};
      break}
    case 'direkt':res={w:{},s:0,txt:()=>''};break;
    default:res=mk(fl,e=>nf(num(e.flaeche))+' m²');
  }

  res.hinweis=hinweis;return res;
}
function abrechnung(y){
  const bel=belegeJahr(y);
  const out={summeUml:0,summeNicht:0,proK:{},einheiten:{},direktOhne:0};
  einheiten().forEach(e=>out.einheiten[e.id]={posten:[],summe:0});
  kostenarten().forEach(k=>{
    const bk=bel.filter(b=>b.kostenart===k.id);
    const gesamt=r2(bk.reduce((s,b)=>s+num(b.betrag),0));
    out.proK[k.id]={gesamt,anzahl:bk.length};
    if(k.umlagefaehig===false){out.summeNicht+=gesamt;return}
    const p=umlAnteil(k);const uml=r2(gesamt*p);
    out.summeUml+=uml;out.summeNicht+=r2(gesamt-uml);out.proK[k.id].uml=uml;
    const kTxt=p<1?'Umlagefähig '+nf(p*100,2)+' % von '+eur(gesamt)+(k.kuerzungText?' ('+k.kuerzungText+')':'')+'; ':'';
    const direkt=bk.filter(b=>b.einheit&&out.einheiten[b.einheit]);
    const verteil=r2(bk.filter(b=>!(b.einheit&&out.einheiten[b.einheit])).reduce((s,b)=>s+num(b.betrag),0)*p);
    direkt.forEach(b=>{const E=out.einheiten[b.einheit];const bb=r2(num(b.betrag)*p);E.posten.push({k,name:k.name+(b.text?' – '+b.text:''),gesamt:bb,schluessel:kTxt+'direkt zugeordnet',anteilTxt:'100 %',betrag:bb,direkt:true})});
    if(verteil){
      const g=gewichte(y,k);out.proK[k.id].hinweis=g.hinweis;
      if(k.schluessel==='direkt'||g.s===0){out.direktOhne+=verteil;out.proK[k.id].hinweis='Ohne Zuordnung – bitte Einheit wählen'}
      else{
        const tn=teilnehmer(k);const ges=tn.map(e=>g.txt?g.txt(e):'');
        const sumTxt=k.schluessel==='flaeche'?nf(tn.reduce((s,e)=>s+num(e.flaeche),0))+' m²':k.schluessel==='personen'?nf(tn.reduce((s,e)=>s+personenVon(y,e),0),1)+' Pers.':k.schluessel==='einheiten'?tn.length+' Einheiten':k.schluessel==='verbrauch'&&!g.hinweis?nf(tn.reduce((s,e)=>s+(verbrauch(y,k.id,e.id)||0),0))+' '+(k.einheit||''):'';
        tn.forEach((e,i)=>{const anteil=g.w[e.id]/g.s;const betrag=r2(verteil*anteil);
          out.einheiten[e.id].posten.push({k,name:k.name,gesamt:verteil,schluessel:kTxt+(k.schluessel==='mix'?'Verbrauch '+nf(k.anteilVerbrauch||70,0)+' % / Fläche '+nf(100-num(k.anteilVerbrauch||70),0)+' %':k.schluessel==='mixpers'?'Personen '+nf(k.anteilVerbrauch||60,0)+' % / Fläche '+nf(100-num(k.anteilVerbrauch||60),0)+' %':SCHLUESSEL[k.schluessel]),
            anteilTxt:ges[i]+(sumTxt?' von '+sumTxt:'')+' = '+nf(anteil*100,2)+' %',betrag,hinweis:g.hinweis})});
      }
    }
  });
  einheiten().forEach(e=>{const E=out.einheiten[e.id];E.summe=r2(E.posten.reduce((s,p)=>s+p.betrag,0));E.vz=vzSumme(y,e);E.saldo=r2(E.summe-E.vz)});
  out.summeUml=r2(out.summeUml);out.summeNicht=r2(out.summeNicht);
  return out;
}

};
const TABS=[['start','Übersicht'],['belege','Belege'],['zaehler','Zähler'],['abrechnung','Abrechnung'],['abschluss','Abschluss'],['einst','Einstellung']];
function renderNav(){$('#nav').innerHTML=TABS.map(([id,l])=>`<button data-tab="${id}" ${S.tab===id?'aria-current="page"':''}>${ICONS[id]}<span>${l}</span></button>`).join('')}
function go(tab){S.tab=tab;S.edit=null;renderNav();render();window.scrollTo(0,0)}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)go(b.dataset.tab)});
$('#y-prev').onclick=()=>setYear(S.year-1);$('#y-next').onclick=()=>setYear(S.year+1);
function setYear(y){S.year=y;ls.set('nk-year',y);render()}

/* ---------- Render ---------- */
function render(){
  $('#y-val').textContent=S.year;
  $('#objname').textContent=S.settings.objekt||'Hüttenheim';
  const v=$('#view');
  if(!S.ready&&db!==null){v.innerHTML='<div class="empty">Daten werden geladen …</div>';return}
  if(!db)return;
  if(!S.einheiten.length&&!S.kostenarten.length&&!S.belege.length){v.innerHTML=startScreen();bindView();bindServer();return}
  if(S.edit){if($('#f-edit')&&v.dataset.editKey===JSON.stringify(S.edit))return;v.innerHTML=renderEdit();v.dataset.editKey=JSON.stringify(S.edit);bindEdit();hydrateBlobs(v);return}
  v.dataset.editKey='';
  v.innerHTML=({start:viewStart,belege:viewBelege,zaehler:viewZaehler,abrechnung:viewAbr,abschluss:viewAbschluss,einst:viewEinst}[S.tab])();
  bindView();
}

/* Übersicht */
function viewStart(){
  const y=S.year,A=abrechnung(y),E=einheiten(),K=kostenarten();
  const warn=[];
  {const l=ls.get('nk-letzte-sicherung');const tage=l?Math.floor((Date.now()-new Date(l).getTime())/864e5):null;
   if(S.belege.length&&(tage===null||tage>30))warn.push(`${tage===null?'Noch keine Sicherung':'Letzte Sicherung vor '+tage+' Tagen'} – unter <b>Einstellung → Datensicherung</b> in OneDrive sichern.`)}
  E.forEach(e=>{if(!num(e.flaeche))warn.push(`Für <b>${esc(e.name)}</b> fehlt die Fläche.`)});
  K.filter(usesZaehler).forEach(k=>{if(A.proK[k.id]?.gesamt&&E.some(e=>verbrauch(y,k.id,e.id)===null))warn.push(`Zählerstände für <b>${esc(k.name)}</b> ${y} unvollständig.`)});
  if(A.direktOhne)warn.push(`${eur(A.direktOhne)} sind keiner Einheit zugeordnet (Schlüssel „direkt“).`);
  const max=Math.max(1,...K.map(k=>A.proK[k.id]?.gesamt||0));
  return `
  <div class="view-head"><h2>Jahr ${y}</h2><div class="actions"><button class="btn primary" data-act="new-beleg">+ Beleg</button></div></div>
  <div class="stack">
  <div class="grid g3">
    <div class="card stat"><span class="label">Umlagefähige Kosten</span><b>${eur(A.summeUml)}</b><span class="small muted">${belegeJahr(y).length} Belege</span></div>
    <div class="card stat"><span class="label">Nicht umlagefähig</span><b>${eur(A.summeNicht)}</b><span class="small muted">Reparaturen, Kredit u. a.</span></div>
    <div class="card stat"><span class="label">Hauskosten gesamt</span><b>${eur(A.summeUml+A.summeNicht)}</b><span class="small muted">${eur((A.summeUml+A.summeNicht)/12)} pro Monat</span></div>
  </div>
  ${warn.length?`<div class="notice">${warn.map(w=>'<div>'+w+'</div>').join('')}</div>`:''}
  ${!E.length?`<div class="card empty">Noch keine Einheiten angelegt. <button class="btn sm" data-tab-go="einst">Einheiten anlegen</button></div>`:''}
  <div class="grid g3">${E.map(e=>{const R=A.einheiten[e.id];const eigen=ohneMieter(e);
    return `<div class="card row click" data-abr="${e.id}" style="flex-direction:column;align-items:stretch;gap:6px">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><h3 style="margin:0">${esc(e.name)}</h3><span class="pill ${eigen?'':'acc'}">${TYP[e.typ]||''}</span></div>
      <div class="small muted">${nf(num(e.flaeche))} m² · ${esc(e.mieter||(eigen?'Eigentümer':'—'))}</div>
      <div style="display:flex;justify-content:space-between"><span class="muted">Kostenanteil</span><span class="amt">${eur(R.summe)}</span></div>
      ${eigen?'':`<div style="display:flex;justify-content:space-between"><span class="muted">Vorauszahlungen</span><span class="amt">${eur(R.vz)}</span></div>
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="pill ${R.saldo>0?'bad':'ok'}">${R.saldo>0?'Nachzahlung':'Guthaben'}</span><span class="amt ${R.saldo>0?'minus':'plus'}">${eur(Math.abs(R.saldo))}</span></div>`}
    </div>`}).join('')}</div>
  <div class="card"><h3>Kosten nach Art ${y}</h3>
    ${K.length?`<div class="stack" style="gap:10px">${K.filter(k=>A.proK[k.id]?.gesamt).map(k=>`<div class="kbar"><span>${esc(k.name)} ${k.umlagefaehig===false?'<span class="pill">nicht umlagefähig</span>':''}</span><span class="amt">${eur(A.proK[k.id].gesamt)}</span><div class="bar"><i style="width:${(A.proK[k.id].gesamt/max*100).toFixed(1)}%"></i></div></div>`).join('')||'<div class="empty">Für '+y+' sind noch keine Belege erfasst.</div>'}</div>`:'<div class="empty">Noch keine Kostenarten.</div>'}

/* Belege */
const GRUPPEN=[['heizung','Heizung'],['wasser','Wasser'],['muell','Müll'],['strom','Strom'],['abgaben','Steuer & Versicherung'],['haus','Haus & Service'],['sonst','Sonstiges'],['privat','Nicht umlagefähig']];
const GRUPPE_NAME=Object.fromEntries(GRUPPEN);
function gruppeVon(k){if(!k)return'sonst';if(k.gruppe)return k.gruppe;const n=String(k.name||'').toLowerCase();
  if(k.umlagefaehig===false)return'privat';
  if(/heiz|pellet|schornstein|kamin|öl\b/.test(n))return'heizung';if(/wasser/.test(n))return'wasser';if(/müll|abfall/.test(n))return'muell';if(/strom/.test(n))return'strom';
  if(/steuer|versicherung|tv|rundfunk|kabel/.test(n))return'abgaben';if(/hausmeister|garten|reinigung|winter/.test(n))return'haus';return'sonst'}
const ICON_CAM='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
function viewBelege(){
  const y=S.year,alle=belegeJahr(y),Ks=kostenarten();const gSum={},gN={};
  alle.forEach(b=>{const g=gruppeVon(kById(b.kostenart));gSum[g]=(gSum[g]||0)+num(b.betrag);gN[g]=(gN[g]||0)+1});
  const gruppen=GRUPPEN.filter(([g])=>Ks.some(k=>gruppeVon(k)===g));
  if(S.filterG&&!gruppen.some(([g])=>g===S.filterG))S.filterG='';
  let B=alle;if(S.filterG)B=B.filter(b=>gruppeVon(kById(b.kostenart))===S.filterG);if(S.filterK)B=B.filter(b=>b.kostenart===S.filterK);
  B=[...B].sort((a,b)=>String(b.datum).localeCompare(String(a.datum)));
  const sum=B.reduce((s,b)=>s+num(b.betrag),0);let lastM='';
  const kInG=S.filterG?Ks.filter(k=>gruppeVon(k)===S.filterG):[];
  return `<div class="view-head"><h2>Belege ${y}</h2><div class="actions"><button class="btn primary" data-foto-g="">${ICON_CAM} Beleg fotografieren</button><button class="btn" data-act="new-beleg">+ Beleg</button></div></div>
  <div class="stack">
  <div class="gtiles">${gruppen.map(([g,l])=>`<div class="gtile${S.filterG===g?' on':''}">
    <button class="gt-main" data-gruppe="${g}" aria-pressed="${S.filterG===g}"><span class="label">${l}</span><b class="num">${eur(gSum[g]||0)}</b><span class="small muted">${gN[g]||0} Belege</span></button>
    <div class="gt-act"><button class="btn sm primary" data-foto-g="${g}" aria-label="${l}: Beleg fotografieren">${ICON_CAM} Foto</button><button class="btn sm" data-neu-g="${g}" aria-label="${l}: Beleg von Hand">+ Hand</button></div></div>`).join('')}</div>
  ${kInG.length>1?`<div class="chips"><button class="chip" data-filter-k="" aria-pressed="${!S.filterK}">Alle ${esc(GRUPPE_NAME[S.filterG])}</button>${kInG.map(k=>`<button class="chip" data-filter-k="${k.id}" aria-pressed="${S.filterK===k.id}">${esc(k.name.replace(/^Heizung – /,''))}</button>`).join('')}</div>`:''}
  <div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span class="label">${S.filterG?esc(GRUPPE_NAME[S.filterG])+' · ':''}${B.length} Belege</span><span class="amt">${eur(sum)}</span></div>
  <div class="list">${B.map(b=>{const m=String(b.datum).slice(0,7);let h='';if(m!==lastM){lastM=m;const[yy,mm]=m.split('-');h=`<div class="month-h">${MONATE[Number(mm)-1]||''} ${yy}</div>`}
    const k=kById(b.kostenart),e=b.einheit?eById(b.einheit):null;
    return h+`<div class="row click" data-beleg="${b.id}"><div class="grow"><div class="title">${esc(b.text||k?.name||'Beleg')}</div><div class="small muted">${fmtDate(b.datum)} · ${esc(k?.name||'ohne Kostenart')}${e?' · nur '+esc(e.name):''}${b.abrJahr&&Number(String(b.datum).slice(0,4))!==Number(b.abrJahr)?' · zählt für '+b.abrJahr:''}${b.foto?' · Foto':''}</div></div><span class="amt">${eur(b.betrag)}</span></div>`}).join('')||`<div class="empty">Keine Belege${S.filterG?' für '+esc(GRUPPE_NAME[S.filterG]):''} in ${y}. Mit „Foto“ eine Rechnung fotografieren oder mit „+ Hand“ eintippen.</div>`}</div></div></div>`;
}

  <div class="card"><h3>Vorauszahlungen & Belegung ${y}</h3>

      <td class="num"><input inputmode="numeric" id="j-${e.id}-monate" data-j="${e.id}|monate" placeholder="12" value="${val(r.monate)}" ${ro}></td>
      <td class="num"><input inputmode="decimal" id="j-${e.id}-personen" data-j="${e.id}|personen" placeholder="${nf(num(e.personen),1)}" value="${val(r.personen)}" ${ro}></td>
      <td class="num"><input inputmode="decimal" id="j-${e.id}-gezahlt" data-j="${e.id}|gezahlt" placeholder="${nf(vzMonat(y,e)*monateVon(y,e))}" value="${val(r.gezahlt)}" ${ro}></td>
      <td class="num">${ohneMieter(e)?'<span class="muted">–</span>':`<input inputmode="decimal" id="j-${e.id}-miete" data-j="${e.id}|mieteGezahlt" placeholder="${nf(mieteMonat(e)*monateVon(y,e))}" value="${val(r.mieteGezahlt)}" ${ro}>`}</td></tr>`}).join('')}
    </tbody></table></div>
    <p class="small muted" style="margin:8px 0 0">Leere Felder nehmen die Standardwerte der Einheit. „Monate“ unter 12 bei Ein- oder Auszug im Jahr. „Gezahlt gesamt“ nur ausfüllen, wenn tatsächlich anders gezahlt wurde.</p>
  </div></div>`;
}

/* Abrechnung */
function viewAbr(){
  const y=S.year,E=einheiten();if(!E.length)return '<div class="card empty">Noch keine Einheiten.</div>';
  if(!S.abrE||!eById(S.abrE))S.abrE=(E.find(e=>!ohneMieter(e))||E[0]).id;
  const e=eById(S.abrE),A=abrechnung(y),R=A.einheiten[e.id],st=S.settings;
  const eigen=ohneMieter(e);
  return `<div class="view-head"><h2>Abrechnung ${y}</h2><div class="actions">${downloads?`<button class="btn primary" data-act="pdf">PDF speichern</button>`:''}</div></div>
  <div class="stack">
  <div class="chips">${E.map(x=>`<button class="chip" data-abr-sel="${x.id}" aria-pressed="${x.id===e.id}">${esc(x.name)}</button>`).join('')}</div>
  <div class="paper">
    <div class="addr"><div><span class="label">Vermieter</span><div>${esc(st.vermieter||'Name Vermieter')}<br>${esc(st.adresse||'Adresse')}</div></div>
      <div><span class="label">${eigen?'Nutzer':'Mieter'}</span><div>${esc(e.mieter||(eigen?'Eigennutzung':'—'))}<br>${esc(e.name)}${e.adresse?'<br>'+esc(e.adresse):''}</div></div></div>
    <div><h2>Betriebskostenabrechnung ${y}</h2><div class="small muted">Abrechnungszeitraum 01.01.${y} – 31.12.${y} · ${esc(st.objekt||'')}${monateVon(y,e)<12?' · Nutzungsdauer '+nf(monateVon(y,e),1)+' Monate':''} · Fläche ${nf(num(e.flaeche))} m²</div></div>
    <div class="table-wrap"><table><thead><tr><th>Kostenart</th><th class="num">Gesamtkosten</th><th>Verteilung</th><th class="num">Ihr Anteil</th></tr></thead><tbody>
    ${R.posten.map(p=>`<tr><td>${esc(p.name)}</td><td class="num">${eur(p.gesamt)}</td><td class="small">${esc(p.schluessel)}<br><span class="muted">${esc(p.anteilTxt)}</span>${p.hinweis?`<br><span class="pill warn">${esc(p.hinweis)}</span>`:''}</td><td class="num">${eur(p.betrag)}</td></tr>`).join('')||`<tr><td colspan="4" class="empty">Für ${y} gibt es noch keine umlagefähigen Kosten.</td></tr>`}
    </tbody><tfoot><tr><td colspan="3">Summe Ihrer Kosten</td><td class="num">${eur(R.summe)}</td></tr>
    ${eigen?'':`<tr><td colspan="3" style="font-weight:500">abzüglich Vorauszahlungen (${nf(monateVon(y,e),1)} × ${eur(vzMonat(y,e))}${ejahr(y,e).gezahlt!==undefined&&ejahr(y,e).gezahlt!==''?', tatsächlich gezahlt':''})</td><td class="num" style="font-weight:500">− ${eur(R.vz)}</td></tr>`}</tfoot></table></div>
    ${eigen?`<div class="result"><span>Eigenanteil ${y}</span><b>${eur(R.summe)}</b></div>`:`
    <div class="result"><span>${R.saldo>0?'Nachzahlung':'Guthaben'}</span><b class="${R.saldo>0?'minus':'plus'}">${eur(Math.abs(R.saldo))}</b></div>
    <p class="small" style="margin:0">${R.saldo>0?`Bitte überweisen Sie den Betrag ${st.frist?'bis '+esc(st.frist):'innerhalb von 30 Tagen'}${st.iban?' auf das Konto '+esc(st.iban):''}.`:'Das Guthaben wird Ihnen erstattet oder mit der nächsten Miete verrechnet.'}
    Belege können nach Absprache eingesehen werden.</p>
    ${R.saldo>0?`<p class="small muted" style="margin:0">Vorschlag neue Vorauszahlung: ${eur(Math.ceil(R.summe/12))} monatlich.</p>`:''}
    ${(()=>{const P=p35(y)[e.id];if(!P||!P.posten.length)return '';return `<div class="small"><b>Bescheinigung nach §35a EStG</b> – in Ihren Kosten enthaltene Arbeitskosten:<br>${P.posten.map(p=>esc(p.name)+' ('+ART35[p.art]+'): '+eur(p.v)).join('<br>')}</div>`})()}`}
  </div></div>`;
}

/* Jahresabschluss */
function aufteilung(y,A){
  A=A||abrechnung(y);const E=einheiten();const totFl=E.reduce((s,e)=>s+num(e.flaeche),0);
  const nicht={},zinsen={};E.forEach(e=>{nicht[e.id]=0;zinsen[e.id]=0});
  belegeJahr(y).forEach(b=>{const k=kById(b.kostenart);if(!k)return;const rest=num(b.betrag)*(1-umlAnteil(k));if(!rest)return;
    const add=(id,v)=>{nicht[id]+=v;if(k.steuerTyp==='zinsen')zinsen[id]+=v};
    if(b.einheit&&nicht[b.einheit]!==undefined)add(b.einheit,rest);
    else E.forEach(e=>add(e.id,totFl?rest*num(e.flaeche)/totFl:rest/E.length))});
  const P35=p35(y);
  const rows=E.map(e=>{const R=A.einheiten[e.id];const eigen=ohneMieter(e);const j=ejahr(y,e);
    const miete=eigen?0:mieteSumme(y,e),vz=eigen?0:R.vz;
    const kosten=r2(R.summe+nicht[e.id]);
    const afa=j.afa!==undefined&&j.afa!==''?num(j.afa):afaJahr(y,e);
    const sonder=num(j.sonderAfa),sonst=num(j.sonstigeWK);
    const einnahmen=r2(miete+vz);
    return{e,eigen,betrieb:e.typ==='betrieb',miete,vz,einnahmen,uml:R.summe,nicht:r2(nicht[e.id]),zinsen:r2(zinsen[e.id]),kosten,
      saldo:eigen?0:R.saldo,ergebnis:eigen?-kosten:r2(einnahmen-kosten),afa,afaAuto:afaJahr(y,e),afaManuell:j.afa!==undefined&&j.afa!=='',sonder,sonst,
      nachAfa:r2(einnahmen-kosten-afa-sonder-sonst),p35:P35[e.id]}});
  return{rows};
}
function afaJahr(y,e){
  const b=num(e.afaBasis),s=num(e.afaSatz);if(!b||!s||!e.afaAb)return 0;
  const [ay,am]=String(e.afaAb).split('-').map(Number);if(!ay||y<ay)return 0;
  const voll=b*s/100,erst=voll*(13-(am||1))/12;
  let bisher=0;for(let j=ay;j<y;j++)bisher+=j===ay?erst:voll;
  return r2(Math.max(0,Math.min(y===ay?erst:voll,b-bisher)));
}
function lohnVon(b,k){if(b.lohn!==undefined&&b.lohn!=='')return num(b.lohn);return num(b.betrag)*num(k.lohnAnteil)/100}
function p35(y){
  const E=einheiten(),totFl=E.reduce((s,e)=>s+num(e.flaeche),0),out={};
  E.forEach(e=>out[e.id]={dienst:0,handwerker:0,dienstUml:0,handwerkerUml:0,posten:[]});
  belegeJahr(y).forEach(b=>{const k=kById(b.kostenart);if(!k||!k.p35a)return;const lohn=lohnVon(b,k);if(!lohn)return;
    const p=umlAnteil(k),umlL=lohn*p,restL=lohn-umlL;
    const add=(id,v,uml)=>{if(!out[id]||!v)return;out[id][k.p35a]+=v;if(uml){out[id][k.p35a+'Uml']+=v;const P=out[id].posten.find(x=>x.k===k.id);if(P)P.v+=v;else out[id].posten.push({k:k.id,name:k.name,art:k.p35a,v})}};
    if(umlL){if(b.einheit&&out[b.einheit])add(b.einheit,umlL,true);
      else if(k.schluessel!=='direkt'){const g=gewichte(y,k);if(g.s>0)teilnehmer(k).forEach(e=>add(e.id,umlL*g.w[e.id]/g.s,true))}}
    if(restL){if(b.einheit&&out[b.einheit])add(b.einheit,restL,false);else E.forEach(e=>add(e.id,totFl?restL*num(e.flaeche)/totFl:restL/E.length,false))}
  });
  Object.values(out).forEach(o=>{['dienst','handwerker','dienstUml','handwerkerUml'].forEach(f=>o[f]=r2(o[f]));o.posten.forEach(p=>p.v=r2(p.v))});
  return out;
}
function vergleich(y){
  const A=abrechnung(y),P=abrechnung(y-1);const bg=jahr(y).begruendung||{};
  const rows=kostenarten().map(k=>{const a=A.proK[k.id]?.gesamt||0,p=P.proK[k.id]?.gesamt||0;
    return{k,a,p,d:r2(a-p),pct:p?(a-p)/p*100:null,bg:bg[k.id]||''}}).filter(r=>r.a||r.p);
  const ta=r2(rows.reduce((s,r)=>s+r.a,0)),tp=r2(rows.reduce((s,r)=>s+r.p,0));
  return{rows,ta,tp,td:r2(ta-tp),tpct:tp?(ta-tp)/tp*100:null};
}
const pctTxt=p=>p===null?'neu':(p>0?'+':'')+nf(p,1)+' %';
const EXP_SEK=[['verg','Vorjahresvergleich mit Begründung'],['einheiten','Einnahmen und Kosten je Einheit'],['steuer','Steuerdaten (AfA, Zinsen, Werbungskosten)'],['p35','§35a Handwerker / Dienstleistungen'],['belege','Belegliste'],['notiz','Notiz an Steuerberater']];
function expWahl(){let w=null;try{w=JSON.parse(ls.get('nk-exp')||'null')}catch(e){}
  w=w||{};w.sek=w.sek||Object.fromEntries(EXP_SEK.map(([k])=>[k,true]));w.einh=w.einh||{};return w}

      <tr><td>Ergebnis Abrechnung ${y} (Zahlung ${y+1})</td>${col(r=>`<td class="num">${r.eigen?'–':(r.saldo>0?'Nachz. ':'Guth. ')+eur(Math.abs(r.saldo))}</td>`)}</tr>

function bindAbschluss(){
  $$('[data-bg]').forEach(i=>i.onchange=()=>{const k=i.dataset.bg,v=i.value.trim();
    mutate('jahre/'+S.year,d=>{d.begruendung=d.begruendung||{};d.begruendung[k]=v;return d}).then(()=>toast('Begründung gespeichert')).catch(dbFail)});
  $$('[data-st]').forEach(i=>i.onchange=()=>{const[eid,f]=i.dataset.st.split('|');const v=i.value.trim()===''?'':num(i.value);
    mutate('jahre/'+S.year,d=>{d.einheiten=d.einheiten||{};d.einheiten[eid]=d.einheiten[eid]||{};d.einheiten[eid][f]=v;return d}).then(()=>toast('Gespeichert')).catch(dbFail)});
  const n=$('[data-abs-notiz]');if(n)n.onchange=()=>mutate('jahre/'+S.year,d=>{d.notiz=n.value.trim();return d}).then(()=>toast('Notiz gespeichert')).catch(dbFail);
  $$('[data-exp-sek],[data-exp-einh]').forEach(c=>c.onchange=()=>{const W=expWahl();
    if(c.dataset.expSek)W.sek[c.dataset.expSek]=c.checked;else W.einh[c.dataset.expEinh]=c.checked;ls.set('nk-exp',JSON.stringify(W))});
}

/* ---------- Texterkennung (läuft im Gerät, keine Daten nach außen) ---------- */
let ocrW=null;
function ocrText(blob,onStatus){return new Promise(async(res,rej)=>{
  if(!ocrW)ocrW=new Worker('ocr/ocr-worker.js');const buf=await blob.arrayBuffer();
  ocrW.onmessage=e=>{const d=e.data;if(d.status){onStatus&&onStatus(d.status);return}d.ok?res(d.text):rej(new Error(d.err))};
  ocrW.onerror=e=>{ocrW=null;rej(new Error(e.message||'Worker-Fehler'))};ocrW.postMessage(buf,[buf])})}
const lieferKey=s=>String(s||'').toLowerCase().replace(/[^a-z0-9äöüß]/g,'').slice(0,24);
function belegAuswerten(text){
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const amt=/(\d{1,3}(?:[.\s]\d{3})*|\d+)[,.](\d{2})(?!\d)/g;
  const val=s=>Math.round(Number(s.replace(/[.\s](?=\d{3}\b)/g,'').replace(/\s/g,'').replace(',','.'))*100);
  const kw=/(zu zahlen|gesamtbetrag|endbetrag|rechnungsbetrag|nachzahlung|abschlag|gesamt|summe|total|betrag)/i;
  let best=0;
  lines.forEach(l=>{if(!kw.test(l))return;const m=[...l.matchAll(amt)];if(m.length){const v=val(m[m.length-1][0]);if(v>best)best=v}});
  if(!best){lines.forEach(l=>{[...l.matchAll(amt)].forEach(m=>{const v=val(m[0]);if(v>best&&v<10000000)best=v})})}
  let datum='';const dm=text.match(/\b(\d{1,2})[.\/-](\d{1,2})[.\/-](20\d{2}|\d{2})\b/);
  if(dm){const y=dm[3].length===2?'20'+dm[3]:dm[3];const mo=Number(dm[2]),d=Number(dm[1]);if(mo>=1&&mo<=12&&d>=1&&d<=31)datum=`${y}-${pad(mo)}-${pad(d)}`}
  const firma=(lines.find(l=>/[A-Za-zÄÖÜäöü]{3,}/.test(l)&&!/rechnung|quittung|beleg|kassenbon|datum|seite|bescheid/i.test(l))||'').replace(/[^\wÄÖÜäöüß&.,\- ]/g,'').trim().slice(0,60);
  return{betrag:best,datum,firma};
}
const KOSTEN_REGELN=[[/pellet/i,/pellet/i],[/heiz[öo]l|heizoel/i,/heizöl/i],[/schornstein|kaminfeger|kehr/i,/schornstein/i],[/wartung|inspektion|kundendienst/i,/wartung|inspektion/i],
  [/abfall|müll|restmüll|biotonne/i,/müll/i],[/grundsteuer|grundbesitzabgaben/i,/grundsteuer/i],[/niederschlag/i,/niederschlag/i],[/wohngebäude|gebäudeversicherung/i,/gebäudeversicherung/i],
  [/haftpflicht/i,/haftpflicht/i],[/hausmeister/i,/hausmeister/i],[/kabel|vodafone|rundfunk|tv/i,/tv|kabel/i],[/wasser|abwasser/i,/wasser/i],[/netze bw|enbw|strom|kwh/i,/strom/i],[/zins|darlehen/i,/zins/i]];
function kostenartRaten(text,firma){
  const sel=$('#b-k');if(!sel)return null;const erlaubt=[...sel.options].map(o=>o.value).filter(Boolean);
  const gelernt=(S.settings.lieferantK||{})[lieferKey(firma)];if(gelernt&&erlaubt.includes(gelernt))return gelernt;
  const g=S.edit&&S.edit.gruppe;const kand=kostenarten().filter(k=>erlaubt.includes(k.id));
  const reihen=g?[kand.filter(k=>gruppeVon(k)===g),kand]:[kand];
  for(const [t,kn] of KOSTEN_REGELN){if(!t.test(text))continue;for(const r of reihen){const k=r.find(k=>kn.test(k.name));if(k)return k.id}}
  return null;
}
async function belegLesen(file){
  const st=$('#ocr-status');const set=(t,show=true)=>{if(st){st.textContent=t;st.hidden=!show}};
  if(/pdf/.test(file.type)){set('PDF angehängt – Betrag und Datum bitte selbst eintragen.');return}
  set('Rechnung wird gelesen …');
  try{const img=await compressImage(file,2000,.92);
    const text=await ocrText(img,s=>set(s==='laden'?'Texterkennung wird gestartet … (beim ersten Mal ca. 5 MB laden)':'Rechnung wird gelesen …'));
    if(!S.edit||S.edit.type!=='beleg'||!$('#f-edit'))return;
    const r=belegAuswerten(text||'');const was=[];
    const b=$('#b-betrag');if(r.betrag&&b&&!b.value){b.value=(r.betrag/100).toFixed(2).replace('.',',');was.push('Betrag')}
    const d=$('#b-datum');if(r.datum&&d){d.value=r.datum;was.push('Datum')}
    const t=$('#b-text');if(r.firma&&t&&!t.value){t.value=r.firma;was.push('Firma')}
    const f=$('#f-edit');if(r.firma)f.dataset.vendor=lieferKey(r.firma);
    const ks=$('#b-k');if(ks&&(!ks.value||(S.edit.gruppe&&ks.options.length>2))){const k=kostenartRaten(text,r.firma);if(k){ks.value=k;was.push('Kostenart')}}
    set(was.length?'Erkannt: '+was.join(', ')+' – bitte prüfen und bei Bedarf ändern.':'Nichts sicher erkannt – bitte selbst eintragen.');
  }catch(e){console.warn(e);set('Texterkennung nicht möglich ('+(e&&e.message||'Fehler')+') – bitte selbst eintragen.')}
}
async function compressImage(file,max=1800,q=.82){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,'image/jpeg',q));
  }finally{URL.revokeObjectURL(url)}
}

/* OneDrive-Ordner (Chrome am Laptop): einmal wählen, dann wird direkt hineingespeichert */
const Ordner={h:null,
  ok:()=>'showDirectoryPicker' in window,
  async load(){try{this.h=(await IDB.get('meta','ordner'))||null}catch(e){this.h=null}},
  async waehlen(){const h=await window.showDirectoryPicker({id:'nk-onedrive',mode:'readwrite',startIn:'documents'});this.h=h;try{await IDB.put('meta','ordner',h)}catch(e){console.warn('Ordner nur für diese Sitzung gemerkt',e)}return h},
  async bereit(){if(!this.h)return false;const o={mode:'readwrite'};try{if(await this.h.queryPermission(o)==='granted')return true;return(await this.h.requestPermission(o))==='granted'}catch(e){return false}},
  async schreiben(pfad,blob){let d=this.h;const t=pfad.split('/').filter(Boolean);const name=t.pop();for(const x of t)d=await d.getDirectoryHandle(x,{create:true});
    const f=await d.getFileHandle(name,{create:true});const w=await f.createWritable();await w.write(blob);await w.close()}
};
const MIME={pdf:'application/pdf',json:'application/json',csv:'text/csv'};
async function saveFile(filename,data,unterordner){
  const ext=filename.split('.').pop().toLowerCase();
  const blob=data instanceof Blob?data:new Blob([data],{type:(MIME[ext]||'text/plain')+';charset=utf-8'});
  try{
    if(Ordner.h&&await Ordner.bereit()){await Ordner.schreiben((unterordner?unterordner+'/':'')+filename,blob);toast('In '+Ordner.h.name+(unterordner?'/'+unterordner:'')+' gespeichert',3500);return true}
    const file=new File([blob],filename,{type:blob.type});
    if(!Ordner.ok()&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return true}
    await localDownloads.save({filename,data:blob});toast('Datei heruntergeladen');return true
  }catch(e){if(e&&e.name==='AbortError')return false;console.error(e);toast('Speichern nicht möglich: '+(e.message||e),5000);return false}}
function extVon(type){return({'application/pdf':'pdf','image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/heic':'heic'})[type]||'bin'}
async function sicherungInOrdner(){
  if(!Ordner.h){toast('Bitte zuerst den OneDrive-Ordner wählen.');return}
  if(!await Ordner.bereit()){toast('Kein Zugriff auf den Ordner – bitte erneut wählen.');return}
  toast('Sicherung läuft …',8000);
  const data={exportiert:new Date().toISOString(),settings:S.settings,einheiten:S.einheiten,kostenarten:S.kostenarten,belege:S.belege,jahre:S.jahre};
  await Ordner.schreiben('Sicherung/Nebenkosten_Sicherung_'+today()+'.json',new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  let n=0,fehlt=0;
  for(const b of S.belege){if(!b.foto)continue;
    const r=await IDB.get('blobs',b.foto).catch(()=>null);let blob=r&&r.blob;
    if(!blob&&SRV.cfg)blob=await srvBlobGet(b.foto).catch(()=>null);
    if(!blob){fehlt++;continue}
    const k=kById(b.kostenart);const name=[b.datum,(k?.name||'Beleg'),(b.text||''),String(r2(num(b.betrag))).replace('.',',')+'EUR'].filter(Boolean).join('_').replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,' ').slice(0,120);
    await Ordner.schreiben(belegJahr(b)+'/Belege/'+name+'.'+extVon(blob.type||(r&&r.type)),blob);n++}
  ls.set('nk-letzte-sicherung',today());
  toast('Gesichert: Daten + '+n+' Belegdateien'+(fehlt?' ('+fehlt+' Belege nicht auf diesem Gerät)':''),5000);render();
}
function csvExport(jahrNur){
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const rows=[['Datum','Abrechnungsjahr','Kostenart','Umlagefähig','Beschreibung','Nur Einheit','Betrag','Notiz'].map(q).join(';')];
  (jahrNur?belegeJahr(jahrNur):[...S.belege]).sort((a,b)=>String(a.datum).localeCompare(String(b.datum))).forEach(b=>{const k=kById(b.kostenart);
    rows.push([fmtDate(b.datum),belegJahr(b),k?.name||'',k?.umlagefaehig===false?'nein':'ja',b.text||'',eById(b.einheit)?.name||'',String(r2(num(b.betrag))).replace('.',','),b.notiz||''].map(q).join(';'))});
  saveFile('Belege_Nebenkosten'+(jahrNur?'_'+jahrNur:'')+'.csv','﻿'+rows.join('\r\n'),jahrNur?String(jahrNur):'Sicherung');
}
function pdfAbschluss(){
  if(!window.jspdf){toast('PDF-Bibliothek nicht geladen.');return}
  const y=S.year,st=S.settings,V=vergleich(y),W=expWahl();
  const rows=aufteilung(y).rows.filter(r=>W.einh[r.e.id]!==false);
  const sek=k=>W.sek[k]!==false;
  if(!EXP_SEK.some(([k])=>sek(k))){toast('Bitte mindestens einen Teil auswählen.');return}
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});
  const tx=s=>String(s??'').replace(/€/g,'EUR').replace(/m²/g,'m2').replace(/m³/g,'m3').replace(/[–−]/g,'-').replace(/§/g,'Par. ');
  const E=n=>(Number(n)||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
  const L=15,R=195;let yy=18,nr=0;
  const need=h=>{if(yy+h>282){doc.addPage();yy=18}};
  const h2=t=>{need(14);yy+=4;doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text(tx((++nr)+'. '+t),L,yy);yy+=6;doc.setFont('helvetica','normal');doc.setFontSize(9)};
  const note=t=>{need(10);doc.setFontSize(8);doc.setTextColor(90);const l=doc.splitTextToSize(tx(t),180);doc.text(l,L,yy+2);doc.setTextColor(0);doc.setFontSize(9);yy+=l.length*3.5+4};
  function table(cols,data,boldRows){
    const head=()=>{doc.setFont('helvetica','bold');doc.setFontSize(8);cols.forEach(c=>doc.text(tx(c.t),c.a==='r'?c.x+c.w:c.x,yy,{align:c.a==='r'?'right':'left'}));yy+=1.5;doc.line(L,yy,R,yy);yy+=4;doc.setFont('helvetica','normal');doc.setFontSize(9)};
    need(12);head();
    data.forEach((row,ri)=>{const cells=row.map((v,i)=>cols[i].wrap?doc.splitTextToSize(tx(v),cols[i].w):[tx(v)]);
      const h=Math.max(...cells.map(c=>c.length))*4+1.5;if(yy+h>282){doc.addPage();yy=18;head()}
      const b=boldRows&&boldRows.includes(ri<0?ri:(ri===data.length-1?-1:ri));
      if(b){doc.setFont('helvetica','bold');if(ri===data.length-1)doc.line(L,yy-3.5,R,yy-3.5)}
      cells.forEach((c,i)=>doc.text(c,cols[i].a==='r'?cols[i].x+cols[i].w:cols[i].x,yy,{align:cols[i].a==='r'?'right':'left'}));
      doc.setFont('helvetica','normal');yy+=h});
  }
  const cw=Math.min(36,(R-75)/Math.max(1,rows.length));
  const ecols=[{t:'',x:L,w:58,wrap:1},...rows.map((r,i)=>({t:r.e.name,x:75+i*cw,w:cw-2,a:'r'}))];
  const line=(lab,f)=>[lab,...rows.map(f)];

  doc.setFont('helvetica','bold');doc.setFontSize(16);doc.text('Jahresabschluss Haus und Nebenkosten '+y,L,yy);yy+=6;
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(80);
  doc.text(tx([st.objekt,st.vermieter].filter(Boolean).join(' | ')+' | erstellt '+fmtDate(today())),L,yy);doc.setTextColor(0);yy+=4;

  if(sek('verg')){h2('Kosten nach Kostenart mit Vorjahresvergleich');
    table([{t:'Kostenart',x:L,w:52,wrap:1},{t:String(y-1),x:67,w:22,a:'r'},{t:String(y),x:91,w:22,a:'r'},{t:'Diff. EUR',x:115,w:20,a:'r'},{t:'%',x:137,w:12,a:'r'},{t:'Begründung',x:152,w:43,wrap:1}],
      [...V.rows.map(r=>[r.k.name+(r.k.umlagefaehig===false?' (nicht uml.)':''),E(r.p),E(r.a),(r.d>0?'+':'')+E(r.d),r.pct===null?'neu':nf(r.pct,1),r.bg]),['Summe',E(V.tp),E(V.ta),(V.td>0?'+':'')+E(V.td),V.tpct===null?'':nf(V.tpct,1),'']],[-1])}

  if(rows.length&&sek('einheiten')){h2('Einnahmen und Kosten je Einheit');
    table(ecols,[
      line('Nutzung',r=>TYP[r.e.typ]||''),
      line('Fläche m2 / Personen',r=>nf(num(r.e.flaeche))+' / '+nf(personenVon(y,r.e),1)),
      line('Kaltmiete erhalten',r=>r.eigen?'-':E(r.miete)),
      line('NK-Vorauszahlungen erhalten',r=>r.eigen?'-':E(r.vz)),
      line('Einnahmen',r=>r.eigen?'-':E(r.einnahmen)),
      line('Umgelegte Betriebskosten',r=>E(r.uml)),
      line('Nicht umgelegte Kosten (nach Fläche)',r=>E(r.nicht)),
      line('  davon Schuldzinsen',r=>E(r.zinsen)),
      line('Kosten gesamt',r=>E(r.kosten)),
      line('Ergebnis Abrechnung (Zahlung '+(y+1)+')',r=>r.eigen?'-':(r.saldo>0?'Nachz. ':'Guth. ')+E(Math.abs(r.saldo)))],[4,8]);
    note('Nachzahlungen und Guthaben aus der Nebenkostenabrechnung fließen steuerlich im Jahr der Zahlung.')}

  if(rows.length&&sek('steuer')){h2('Steuerdaten (Anlage V / EÜR)');
    table(ecols,[
      line('Einnahmen',r=>r.eigen?'-':E(r.einnahmen)),
      line('Betriebskosten gesamt (inkl. Zinsen)',r=>E(r.kosten)),
      line('  davon Schuldzinsen',r=>E(r.zinsen)),
      line('AfA Gebäude',r=>E(r.afa)+(r.e.afaSatz&&!r.afaManuell?' ('+nf(num(r.e.afaSatz),2)+'%)':'')),
      line('Sonder-AfA',r=>E(r.sonder)),
      line('Sonstige Werbungskosten',r=>E(r.sonst)),
      line('Ergebnis',r=>r.e.typ==='eigen'?'privat':r.betrieb?'BA '+E(r.kosten+r.afa+r.sonder+r.sonst):E(r.nachAfa))],[6]);
    const afaInfo=rows.filter(r=>num(r.e.afaBasis)).map(r=>r.e.name+': Bemessungsgrundlage '+E(r.e.afaBasis)+' EUR, '+nf(num(r.e.afaSatz),2)+' %, ab '+fmtDate(r.e.afaAb));
    note((afaInfo.length?afaInfo.join('; ')+'. ':'')+'Eigennutzung privat; Eigener Betrieb als Betriebsausgaben (BA). Prüfung durch den Steuerberater.')}

  if(rows.length&&sek('p35')){h2('Par. 35a EStG – Lohnanteile');
    table(ecols,[
      line('Haushaltsnahe Dienstleistungen',r=>E(r.eigen?r.p35.dienst:r.p35.dienstUml)),
      line('Handwerkerleistungen',r=>E(r.eigen?r.p35.handwerker:r.p35.handwerkerUml)),
      line('Steuerermäßigung ca. 20 %',r=>r.betrieb?'-':E(0.2*(r.eigen?r.p35.dienst+r.p35.handwerker:r.p35.dienstUml+r.p35.handwerkerUml)))],[-1]);
    note('Mieter: Anteil an umgelegten Kosten. Eigennutzung: Anteil an allen Kosten inkl. Reparaturen. Nur Arbeits-, Maschinen- und Fahrtkosten, unbar bezahlt.')}

  if(sek('belege')){h2('Belegliste '+y);
    const B=[...belegeJahr(y)].sort((a,b)=>String(a.datum).localeCompare(String(b.datum)));
    table([{t:'Datum',x:L,w:18},{t:'Kostenart',x:34,w:50,wrap:1},{t:'Beschreibung',x:86,w:66,wrap:1},{t:'Lohn 35a',x:152,w:18,a:'r'},{t:'Betrag EUR',x:172,w:23,a:'r'}],
      [...B.map(b=>{const k=kById(b.kostenart);const l=k&&k.p35a?lohnVon(b,k):0;return[fmtDate(b.datum),k?.name||'',[b.text,eById(b.einheit)?'nur '+eById(b.einheit).name:'',b.notiz].filter(Boolean).join(' | '),l?E(l):'',E(b.betrag)]}),['','Summe '+B.length+' Belege','','',E(B.reduce((s,b)=>s+num(b.betrag),0))]],[-1])}

  if(sek('notiz')&&jahr(y).notiz){h2('Notiz');need(10);const l=doc.splitTextToSize(tx(jahr(y).notiz),180);doc.text(l,L,yy);yy+=l.length*4}
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(120);doc.text('Seite '+i+' von '+n,R,290,{align:'right'});doc.setTextColor(0)}
  saveFile('Jahresabschluss_'+y+'.pdf',doc.output('blob'),String(y));
}

function pdfExport(){
  if(!window.jspdf){toast('PDF-Bibliothek nicht geladen.');return}
  const y=S.year,e=eById(S.abrE),A=abrechnung(y),R=A.einheiten[e.id],st=S.settings,eigen=ohneMieter(e);
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});
  const E=n=>(Number(n)||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' EUR';
  let yy=20;const L=20,Rr=190;
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(90);
  doc.text([st.vermieter||'',st.adresse||''].filter(Boolean),L,yy);

  doc.text([e.mieter||(eigen?'Eigennutzung':''),e.name,e.adresse||''].filter(Boolean),L,yy);

  doc.setTextColor(0);yy+=10;
  const head=()=>{doc.setFont('helvetica','bold');doc.setFontSize(9);doc.text('Kostenart',L,yy);doc.text('Gesamtkosten',105,yy,{align:'right'});doc.text('Verteilung',110,yy);doc.text('Ihr Anteil',Rr,yy,{align:'right'});yy+=2;doc.line(L,yy,Rr,yy);yy+=5;doc.setFont('helvetica','normal')};
  head();
  R.posten.forEach(p=>{

    const h=Math.max(nm.length,vt.length)*4.2+2;

    yy+=h;});
  if(yy>230){doc.addPage();yy=20}

    yy+=4;doc.setLineWidth(.6);doc.line(L,yy,Rr,yy);doc.setLineWidth(.2);yy+=8;doc.setFont('helvetica','bold');doc.setFontSize(13);
    doc.text(R.saldo>0?'Nachzahlung':'Guthaben',L,yy);doc.text(E(Math.abs(R.saldo)),Rr,yy,{align:'right'});
    yy+=10;doc.setFont('helvetica','normal');doc.setFontSize(9.5);
    const t=R.saldo>0?'Bitte überweisen Sie den Betrag '+((st.frist?'bis '+st.frist:'innerhalb von 30 Tagen')+(st.iban?' auf das Konto '+st.iban:''))+'.':'Das Guthaben wird Ihnen erstattet oder mit der nächsten Miete verrechnet.';
    const tl=doc.splitTextToSize(t+' Die Belege können nach Absprache eingesehen werden.',170);doc.text(tl,L,yy);yy+=tl.length*4.5+4;
    const P=p35(y)[e.id];

      doc.setFont('helvetica','bold');doc.text('Bescheinigung nach Par. 35a EStG - enthaltene Arbeitskosten:',L,yy);doc.setFont('helvetica','normal');yy+=5;
      P.posten.forEach(p=>{doc.text((p.name+' ('+ART35[p.art]+')').replace(/[–−]/g,'-'),L,yy);doc.text(E(p.v),Rr,yy,{align:'right'});yy+=4.5})}
  }else{yy+=8;doc.setFontSize(12);doc.text('Eigenanteil '+y,L,yy);doc.text(E(R.summe),Rr,yy,{align:'right'})}
  saveFile('Nebenkostenabrechnung_'+y+'_'+e.name.replace(/[^\wäöüÄÖÜß-]+/g,'_')+'.pdf',doc.output('blob'),String(y));
}
